<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VCBA — Tech & Budget Evaluation Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght=400;500;600;700&family=Plus+Jakarta+Sans:wght=600;700;800&family=Space+Mono:wght=400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0f19;
    --surface: #131c2e;
    --surface2: #1e293b;
    --border: #24324d;
    --accent: #f59e0b;
    --accent-dim: rgba(245, 158, 11, 0.1);
    --green: #10b981;
    --green-dim: rgba(16, 185, 129, 0.1);
    --red: #ef4444;
    --red-dim: rgba(239, 68, 68, 0.1);
    --blue: #3b82f6;
    --blue-dim: rgba(59, 130, 246, 0.1);
    --purple: #8b5cf6;
    --purple-dim: rgba(139, 92, 246, 0.1);
    --text: #f8fafc;
    --muted: #64748b;
    --muted2: #94a3b8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 2rem 1.5rem;
    max-width: 1200px;
    margin: 0 auto;
    line-height: 1.5;
  }

  /* DASHBOARD CARD CONTAINERS */
  .dashboard-section {
    background: rgba(19, 28, 46, 0.6);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2.5rem;
    margin-bottom: 2rem;
    backdrop-filter: blur(8px);
  }

  /* HEADER STYLE */
  .header {
    margin-bottom: 2rem;
    padding-bottom: 2rem;
    border-bottom: 1px solid var(--border);
  }
  .badge-row { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
  .badge {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    padding: 0.3rem 0.75rem;
    border-radius: 6px;
    text-transform: uppercase;
  }
  .badge-yellow { background: var(--accent); color: #0b0f19; }
  .badge-outline { background: transparent; color: var(--muted2); border: 1px solid var(--border); }
  
  h1 {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: clamp(2rem, 5vw, 2.75rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.15;
    margin-bottom: 0.5rem;
  }
  .header-sub { font-size: 1rem; color: var(--muted2); }

  /* BLUF CARD */
  .bluf-card {
    background: linear-gradient(135deg, #131c2e, #1a1736);
    border: 1px solid var(--blue);
    border-radius: 12px;
    padding: 1.5rem;
    margin-bottom: 2.5rem;
  }
  .bluf-title {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--blue);
    margin-bottom: 0.5rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  /* FLEX GRAPH ROWS */
  .top-grid {
    display: grid;
    grid-template-columns: 1.1fr 0.9fr;
    gap: 2rem;
    margin-bottom: 1rem;
    align-items: stretch;
  }

  /* COST CHART COMPONENT */
  .chart-container {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
    width: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .chart-row { margin-bottom: 1.25rem; width: 100%; }
  .chart-row:last-child { margin-bottom: 0; }
  .chart-info { display: flex; justify-content: space-between; margin-bottom: 0.5rem; font-size: 0.9rem; font-weight: 600; }
  .chart-bar-bg { background: var(--surface2); height: 24px; border-radius: 6px; overflow: hidden; display: flex; align-items: center; width: 100%; }
  .chart-bar { height: 100%; border-radius: 6px; transition: width 0.5s ease; max-width: 100%; }
