name: VCBA PCO Sunday Readiness Checker

on:
  schedule:
    # Friday 8PM PDT (Sat 3AM UTC)
    - cron: "0 3 * * 6"
    # Saturday 2PM PDT (Sat 9PM UTC)
    - cron: "0 21 * * 6"
  workflow_dispatch:
    inputs:
      day_override:
        description: "Override day (5=Fri, 6=Sat) for testing"
        required: false
        default: ""

jobs:
  check-pco:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install nodemailer

      - name: Run PCO Checker
        env:
          PCO_APP_ID: ${{ secrets.PCO_APP_ID }}
          PCO_SECRET: ${{ secrets.PCO_SECRET }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DAY_OVERRIDE: ${{ github.event.inputs.day_override }}
        run: node pco-tools/pco-checker.js
