name: VCBA PCO Sunday Readiness Checker

on:
  schedule:
    # Wednesday 9PM PT (Thu 5AM UTC)
    - cron: "0 5 * * 4"
    # Thursday 9PM PT (Fri 5AM UTC)
    - cron: "0 5 * * 5"
    # Friday 9PM PT (Sat 5AM UTC)
    - cron: "0 5 * * 6"
    # Saturday 9PM PT (Sun 5AM UTC) — catches files before Sunday
    - cron: "0 5 * * 0"
  workflow_dispatch:
    inputs:
      day_override:
        description: "Override day (3=Wed, 4=Thu, 5=Fri, 6=Sat) for testing"
        required: false
        default: ""

jobs:
  check-pco:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run PCO Checker
        env:
          PCO_APP_ID: ${{ secrets.PCO_APP_ID }}
          PCO_SECRET: ${{ secrets.PCO_SECRET }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DAY_OVERRIDE: ${{ github.event.inputs.day_override }}
        run: node pco-checker.js
